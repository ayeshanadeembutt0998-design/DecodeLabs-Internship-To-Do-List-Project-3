<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="header">

        <div class="logo">
            <span class="logo-icon">✓</span>
            <h2>To-Do List</h2>
        </div>

        <!-- Dark / Light Mode Button -->
        <button id="themeToggle" class="theme-toggle" type="button">
            <i class="ri-moon-line"></i>
        </button>

    </header>


    <!-- ================= MAIN ================= -->
    <main class="container">

        <!-- Introduction -->
        <section class="intro">

            <h1>My Tasks</h1>

            <p>
                Organize your day and get things done.
            </p>

        </section>


        <!-- ================= ADD TASK ================= -->
        <section class="add-task">

            <input type="text" id="taskInput" placeholder="What do you need to do?" autocomplete="off">

            <button id="addTaskBtn" type="button">
                Add Task
            </button>

        </section>


        <!-- ================= TASK STATISTICS ================= -->
        <section class="task-stats">

            <div class="stat-box">

                <span id="totalTasks">0</span>

                <p>Total Tasks</p>

            </div>


            <div class="stat-box">

                <span id="completedTasks">0</span>

                <p>Completed</p>

            </div>


            <div class="stat-box">

                <span id="remainingTasks">0</span>

                <p>Remaining</p>

            </div>

        </section>


        <!-- ================= FILTER BUTTONS ================= -->
        <section class="filters">

            <button class="filter-btn active" data-filter="all" type="button">
                All
            </button>

            <button class="filter-btn" data-filter="active" type="button">
                Active
            </button>

            <button class="filter-btn" data-filter="completed" type="button">
                Completed
            </button>

        </section>


        <!-- ================= TASK LIST ================= -->
        <section class="task-container">

            <ul id="taskList">

                <!--
                    Tasks will be dynamically
                    created here using JavaScript.
                -->

            </ul>


            <!-- Shown when there are no tasks -->
            <div id="emptyMessage" class="empty-message">

                <div class="empty-icon">✓</div>

                <h3>No tasks yet</h3>

                <p>
                    Add your first task to get started!
                </p>

            </div>

        </section>




    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="footer">

        <p>
            Stay organized. Stay productive.
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
